backend:
  name: github
  repo: smarcadet/cshautsnogent
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: actualites
    label: Actualités
    folder: src/content/actualites
    create: true

    fields:
      - label: Titre
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime

      - label: Contenu
        name: body
        widget: markdown